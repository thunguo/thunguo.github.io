name: daily-digest

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 北京时间 08:00
  workflow_dispatch:       # 手动补跑

permissions:
  contents: write          # push digest 回仓库

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PH_CLIENT_ID: ${{ secrets.PH_CLIENT_ID }}
          PH_CLIENT_SECRET: ${{ secrets.PH_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 提升 GitHub Search API 限额
        run: python -m pipeline.run

      - name: commit digest
        run: |
          git config user.name "agent-daily-bot"
          git config user.email "bot@users.noreply.github.com"
          git add digest/
          git diff --cached --quiet || git commit -m "digest: $(date +%F)"
          git push
